[package]
name = "pinakes-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
blake3 = { workspace = true, features = ["traits-preview"] }
chrono.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
utoipa.workspace = true
utoipa-swagger-ui.workspace = true
# Signed packets only: PKARR records come from relays through Egress (`resolver::pkarr_relays`).
pkarr = { version = "=8.1.0", default-features = false, features = ["signed_packet"] }
getrandom = "0.4"
hmac = "0.13"
# Page cursors as bytes (`collections`); already built for pubky-common.
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
scraper = "0.24"
# The HTML named character references (the same table scraper's parser uses).
markup5ever = "=0.35.0"
# scraper's own parser and tree, fed in pieces under a CPU budget (`resolver::html`).
html5ever = "=0.35.0"
# The parse budget is the parsing thread's CPU time (`clock_gettime`).
libc = "0.2"
toml = "0.9"
ipnet = "2"
async-stream = "0.3"
prometheus = "0.14"
chrono-tz = "=0.10.4"
percent-encoding = "2"
# A page's text in the character encoding it declares (`resolver::egress::decode`).
encoding_rs = "=0.8.35"
rrule = "=0.14.0"
roxmltree = "=0.21.1"
# Streams a feed body cut off at the page cap, to complete it after its last whole item.
quick-xml = "=0.37.5"
sha1 = "=0.10.7"
sha2 = "=0.10.9"
tzf-rs = { version = "=1.1.4", default-features = false }
nostr = { version = "=0.45.5", default-features = false, features = ["std"] }
tokio-tungstenite = { version = "=0.28.0", features = ["rustls-tls-webpki-roots"] }
# The relay connections' TLS configuration names its provider (ring) and roots itself
# (`resolver::egress`): the build links two providers, so rustls has no default of its own.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
psl = "=2.1.241"
tower-http = { version = "=0.6.11", default-features = false, features = ["catch-panic"] }
flate2 = "=1.1.10"
httpdate = "=1.0.3"
# The MCP endpoint (`agents::mcp`): the official Rust SDK, its stateless Streamable HTTP server.
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
# An MCP tool's request to the public routes (`agents::mcp`).
tower = { version = "0.5", features = ["util"] }

# The post envelope app posts are written on (`resolver::pubky_apps::posts`): the pin Nexus and
# the music node use.
pubky-social-specs = "=1.0.0-rc.1"
# The text index (`search_index`): pure Rust, without its zstd (C) and stemmer features.
tantivy = { version = "=0.27.0", default-features = false, features = ["mmap", "lz4-compression"] }
# The text index's map cells (`search_index::cells`), H3 in pure Rust.
h3o = "=0.11.1"
# Catalogue bulk files (`catalogue::bulk`): xz streams with liblzma's multi-threaded decoder
# (built from its bundled source), and the importers' sorted runs (`catalogue::spill`) as lz4
# frames (tantivy's own lz4).
liblzma = { version = "=0.4.9", features = ["parallel", "static"] }
lz4_flex = "=0.14.2"
bytes = "1"
# The importers' parsing threads share one bounded queue of lines.
crossbeam-channel = "0.5"
# Line ends in the importers' bulk files.
memchr = "2"

[[example]]
name = "e2e_stack"
# Its unit tests (the live sample selection) run with the workspace's tests.
test = true

[features]
# What the integration tests share with the unit tests (`test_support`, and setters no
# production path calls). Only the dev-dependency below turns it on: never in the daemon.
test-util = []

[dev-dependencies]
pinakes-core = { path = ".", features = ["test-util"] }
# scraper's tree nodes, named by a test of the rebuilt tree (`resolver::html`).
ego-tree = "=0.10.0"
secp256k1 = "=0.30.0"
serde_yaml_ng = "0.10"
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { version = "0.3", features = ["json"] }
http-body-util = "0.1"
tempfile = "3"
# The loopback relay of the relay TLS test (`resolver::egress`).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# Property and fuzz tests of the OSM readers and cards (`catalogue::osm`).
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
