thers.","sameAs":["https:\/\/www.budgetbytes.com\/about\/","https:\/\/www.facebook.com\/budgetbytes1","https:\/\/x.com\/Budget_Bytes"],"url":"https:\/\/www.budgetbytes.com\/author\/beth\/"},{"@type":"Recipe","name":"One Pot Creamy Pesto Chicken Pasta","author":{"@id":"https:\/\/www.budgetbytes.com\/#\/schema\/person\/de533a4dad507aefcf8ea04e131701f9"},"description":"This super lush and Creamy Pesto Chicken Pasta is perfect for busy weeknights. Everything cooks in one pot and is done in under 30 minutes! ","datePublished":"2025-01-09T14:30:00+00:00","image":["https:\/\/www.budgetbytes.com\/wp-content\/uploads\/2019\/10\/Creamy-Pesto-Chicken-Pasta-close-plate.jpg","https:\/\/www.budgetbytes.com\/wp-content\/uploads\/2019\/10\/Creamy-Pesto-Chicken-Pasta-close-plate-500x500.jpg","https:\/\/www.budgetbytes.com\/wp-content\/uploads\/2019\/10\/Creamy-Pesto-Chicken-Pasta-close-plate-500x375.jpg","https:\/\/www.budgetbytes.com\/wp-content\/uploads\/2019\/10\/Creamy-Pesto-Chicken-Pasta-close-plate-480x270.jpg"],"video":{"name":"One Pot Creamy Pesto Chicken Pasta","description":"This super lush and Creamy Pesto Chicken Pasta is perfect for busy weeknights. Everything cooks in one pot and is done in under 30 minutes! FULL RECIPE BELOW. 👇\n\nPRINTABLE RECIPE:\n\nINGREDIENTS\n1 lb. boneless, skinless chicken breast ($5.56)\n2 Tbsp butter ($0.26)\n2 cloves garlic ($0.16)\n1\/2 lb. penne pasta ($0.40)\n1.5 cups chicken broth ($0.20)\n1 cup milk ($0.32)\n3 oz. cream cheese ($0.29)\n1\/3 cup basil pesto ($0.73)\n1\/4 cup grated Parmesan ($0.44)\nfreshly cracked pepper ($0.03)\n1 pinch crushed red pepper ($0.02)\nOPTIONAL ADD-INS\n3 cup fresh spinach ($0.90)\n1\/4 cup sliced sun dried tomatoes ($1.10)\n\nINSTRUCTIONS\n1. Cut the chicken breast into 1-inch pieces. Add the butter to a deep skillet and melt over medium heat. Add the chicken to the skillet and cook over medium heat until the chicken is slightly browned on the outside.\n2. While the chicken is cooking, mince the garlic. Add the garlic to the skillet with the chicken and continue to sauté for one minute more.\n3. Add the uncooked pasta and chicken broth to the skillet with the chicken and garlic. Stir to dissolve any browned bits from the bottom of the skillet. Place a lid on the skillet, turn the heat up to medium-high, and bring the broth up to a boil.\n4. Once the broth comes to a full boil, give the pasta a quick stir, replace the lid, and turn the heat down to medium-low. Let the pasta simmer over medium-low heat for about 8 minutes, or until the pasta is tender and most of the broth has been absorbed. Stir the pasta briefly every two minutes as it simmers, replacing the lid quickly each time.\n5. Once the pasta is tender and most of the broth absorbed, add the milk, cream cheese (cut into chunks), and pesto. Stir and cook over medium heat until the cream cheese has fully melted into the sauce. Finally, add the grated Parmesan and stir until combined.\n6. If using, add the fresh spinach and sliced sun dried tomatoes. Stir until the spinach has wilted, then remove the pasta from the heat. Top the pasta with freshly cracked pepper and a pinch of crushed red pepper, then serve.\n\nSee how we calculate recipe costs here:\n\nInstagram: budgetbytes\nFacebook: budgetbytes1\nPinterest: budgetbytes\nTwitter: budget_bytes\n\nTIMESTAMPS\n0:00 Introduction\n0:09 Sauté Chicken in Butter\n0:14 Add Minced Garlic\n0:17 Add Pasta and Broth\n0:24 Simmer\n0:31 Stir in Cream Cheese, Pesto, and Milk\n0:43 Add Parmesan\n0:47 Season with Pepper and Crushed Red Pepper\n0:49 Fold in Sun Dried Tomatoes and Spinach\n1:00 Serve and Enjoy!","uploadDate":"2020-12-06T16:30:02+00:00","creator":{"@type":"Organization","name":"Budget Bytes","url":"https:\/\/www.youtube.com\/channel\/UC17vdVOZBVxTSDcldUBBlRg"},"duration":"PT1M8S","interactionStatistic":[{"@type":"InteractionCounter","interactionType":{"@type":"WatchAction"},"userInteractionCount":77936},{"@type":"InteractionCounter","interactionType":{"@type":"Lik n-pasta\/#wprm-recipe-45797-step-0-4"},{"@type":"HowToStep","text":"If using, add the fresh spinach and sliced sun dried tomatoes. Stir until the spinach has wilted, then remove the pasta from the heat. Top the pasta with freshly cracked pepper and a pinch of crushed red pepper, then serve.","name":"If using, add the fresh spinach and sliced sun dried tomatoes. Stir until the spinach has wilted, then remove the pasta from the heat. Top the pasta with freshly cracked pepper and a pinch of crushed red pepper, then serve.","url":"https:\/\/www.budgetbytes.com\/one-pot-creamy-pesto-chicken-pasta\/#wprm-recipe-45797-step-0-5"}],"aggregateRating":{"@type":"AggregateRating","ratingValue":"4.84","ratingCount":"254","reviewCount":"14"},"review":[{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"4"},"reviewBody":"I think I will use chicken thighs instead of breast next time as thighs can stand up to the cooking times and still be more juicy than chicken breast. Otherwise, my family loved it especially the sauce. Thank you.","author":{"@type":"Person","name":"Angela Jones"},"datePublished":"2026-08-10"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"1"},"reviewBody":"This recipe was not good for me. I would do it completely different next time. I would cook the chicken with only a small amount of oil in the cast iron to get it browned on high, and cook the noodles separately. There was not enough broth to cook the noodles, I had to add more, and then I had to cut back in milk. Doubled the pesto and cheese to make it thicker. In the end the chicken was basically boiled and overcooked.\r\n\r\nDisappointing recipe. :\/","author":{"@type":"Person","name":"Lilli"},"datePublished":"2026-08-04"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"This was delicious! I added extra garlic and I didn’t have tomatoes or spinach on hand so I used canned artichokes instead. Next time I’ll cook as directed! Wonderful recipe!!","author":{"@type":"Person","name":"Kristen"},"datePublished":"2026-06-26"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"I just made this for the second time.  We love it.  Second time I didn't have cream cheese but used heavy cream and it turned out great.  This will be on rotation.  Quick and easy.  It's also a great way to use up homemade pesto.","author":{"@type":"Person","name":"Kathleen Schwendeman"},"datePublished":"2026-04-27"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"This was delicious! A really yummy, easy, one pot recipe that comes together really nicely. Make sure you get a good quality basil pesto as I think that makes a big difference. I also used half a cup more chicken stock and a bit more pasta.","author":{"@type":"Person","name":"Brooke"},"datePublished":"2026-04-27"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"I love this recipe, I don't add the milk, but use garlic and herb cream cheese, copious amounts of it. Always double the pesto and parmesan, spinach and sun-dried tomatoes. It's a winner iny house, one pan dinners are my absolute favourite, much less washing up than a roast dinner. Thankyou for posting this, I have printed and laminated your recipe and it's become extremely popular with the girls at work. UK fan here, I will be trying your other recipes","author":{"@type":"Person","name":"Yve"},"datePublished":"2026-04-12"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Made this last night for supper. My family really enjoyed it and there were no leftovers. I used homemade garlic chive pesto and homemade sundried tomatoes. It was really quick as well.","author":{"@type":"Person","name":"Jerilea"},"datePublished":"2026-03-03"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"This was a hit, I added just a little rotisserie chicken seasoning to my chicken while it was cooking. Thanks for another great recipe to add to our meal plan!","author":{"@type":"Person","name":"Kirsten"},"datePublished":"2026-02-26"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Bless you for this recipe. My teenage son requested this in our regular rotation. Delicious! I always double this and sub the spinach for the \"power greens\" mix and have enough for a few days at least.","author":{"@type":"Person","name":"Aileen D"},"datePublished":"2026-02-19"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"This was genuinely amazing like 11\/10 my favorite pasta ever!!!’nn","author":{"@type":"Person","name":"Jacob Winans"},"datePublished":"2026-01-14"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"made this and love it!!!\r\nI accidentally bought roasted red peppers so I just used them and it was absolutely delicious!\r\nThe next day i decided to make it again , so it  can have lunches for the coming week. I used the sun dried tomatoes &amp; I got to say I liked the prepped better but it was still delicious!\r\nOne of my new favorites!","author":{"@type":"Person","name":"Delilah Bell"},"datePublished":"2025-11-02"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Made this with protein (chickpea) Farfalle noodles and it turned out fantastic!  Farfalle needs a couple extra minutes to become tender in the middle so use a “heaping” 1.5 cups of broth.","author":{"@type":"Person","name":"Hunter"},"datePublished":"2025-10-07"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"I have a question! I only have frozen spinach. Should I I thaw it, drain it and then add to this recipe?","author":{"@type":"Person","name":"Esther Tolooei"},"datePublished":"2025-09-23"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Hi Beth! I made this recipe
