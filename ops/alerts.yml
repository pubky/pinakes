groups:
  - name: pinakes
    rules:
      - alert: IngestionStalled
        expr: time() - pinakes_ingest_last_success_timestamp_seconds > 900
        labels: {severity: critical, reason: no_success}
        annotations: {summary: "Pinakes has not applied a successful Nexus poll for 15 minutes"}
      - alert: SearchIndexStalled
        expr: pinakes_search_index_last_pass_timestamp_seconds > 0 and time() - pinakes_search_index_last_pass_timestamp_seconds > 600
        labels: {severity: warning}
        annotations: {summary: "The Pinakes text index has not read its queue for 10 minutes: text searches miss newer changes"}
      - alert: SearchIndexClosed
        expr: pinakes_search_index_open == 0
        for: 30m
        labels: {severity: warning}
        annotations: {summary: "The Pinakes text index has not opened for 30 minutes (unwritable search.index_dir or a failing build): text searches read Postgres alone"}
      - alert: TextSearchBusy
        expr: sum by (instance, job) (increase(pinakes_search_index_busy_total[10m])) > 10
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Pinakes answered over ten text searches 503 in ten minutes for ten minutes: the text index had no free turn (limits.search_index_searches), searches ran past limits.search_index_budget_ms, or one client held its share of turns"}
      - alert: BackgroundLoopFailing
        expr: increase(pinakes_background_failures_total{loop!~"retention|cleanup|osm_prune|also_on_prune|refill|unhint|osm_dump|same_event_sweep|same_recording_sweep"}[15m]) > 0 and on (instance, job, loop) time() - pinakes_background_last_success_timestamp_seconds > 900
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "The Pinakes {{ $labels.loop }} loop has failed and finished no pass for 25 minutes: its work waits (groups, also-on rows, hints, catalogue joins and extras, the search revision fold); its warning log line names the error"}
      - alert: HintSweepFailing
        expr: increase(pinakes_background_failures_total{loop=~"same_event_sweep|same_recording_sweep"}[15m]) > 0 and on (instance, job, loop) time() - pinakes_background_last_success_timestamp_seconds > 4500
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "The hourly {{ $labels.loop }} has failed and finished no pass for an hour and a quarter: hint pairs of units that entered or left the window wait; its warning log line names the error"}
      - alert: MaintenanceStepFailing
        expr: increase(pinakes_background_failures_total{loop=~"retention|cleanup|osm_prune|also_on_prune|refill|unhint"}[3h]) > 0 and on (instance, job, loop) time() - pinakes_background_last_success_timestamp_seconds > 7200
        for: 1h30m
        labels: {severity: warning}
        annotations: {summary: "The hourly {{ $labels.loop }} maintenance step keeps failing (three passes in a row, two after a start): its work waits (change retention, orphan cleanup, OSM place or also-on pruning, stale card values); its warning log line names the error"}
      - alert: OdblDumpFailing
        expr: increase(pinakes_background_failures_total{loop="osm_dump"}[30m]) > 0 and on (instance, job, loop) time() - pinakes_background_last_success_timestamp_seconds > 1800
        for: 25m
        labels: {severity: warning}
        annotations: {summary: "The ODbL dump has failed for 25 minutes and written no file since: /v1/dumps/osm_place.ndjson.gz serves the previous file, or 503 before the first; its warning log line names the error"}
      - alert: MapClustersBusy
        expr: sum by (instance, job) (increase(pinakes_api_requests_total{listener="public",route="/v1/map/clusters",status="503"}[10m])) > 10
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Pinakes answered over ten map cluster counts 503 in ten minutes for ten minutes: all four turns were taken, a client held its two, or views too wide for their filter ran past limits.map_cluster_timeout_ms"}
      - alert: MetricsMissing
        expr: absent(pinakes_ingest_last_success_timestamp_seconds)
        for: 5m
        labels: {severity: critical, reason: no_series}
        annotations: {summary: "No Pinakes metrics for five minutes: the daemon is down or its /metrics is not scraped"}
      - alert: MetricsMissing
        expr: up{job="pinakes"} == 0
        for: 5m
        labels: {severity: critical, reason: target_down}
        annotations: {summary: "Pinakes target {{ $labels.instance }} has not answered a /metrics scrape for five minutes"}
      - alert: MetricsStale
        expr: increase(pinakes_metrics_refresh_failures_total[5m]) > 0
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "Pinakes /metrics failed to read its database repeatedly over fifteen minutes: the queue, canary and ingestion gauges may be stale"}
      - alert: IngestionStalled
        expr: pinakes_ingest_lag_lines > 1000
        for: 10m
        labels: {severity: critical, reason: lag}
        annotations: {summary: "Pinakes ingestion lag has exceeded 1000 lines for 10 minutes"}
      - alert: CanaryDown
        expr: pinakes_canary_consecutive_failures >= 3
        labels: {severity: warning}
        annotations: {summary: "Pinakes canary failed three consecutive runs for {{ $labels.source }}"}
      - alert: SchemaDrift
        expr: sum by (source) (increase(pinakes_fetch_total{outcome="drift"}[1h])) > 0
        labels: {severity: warning}
        annotations: {summary: "Pinakes parser lost expected fields for {{ $labels.source }}"}
      - alert: WallUp
        expr: (sum by (source) (increase(pinakes_fetch_total{outcome=~"unreachable|blocked"}[2h])) / sum by (source) (increase(pinakes_fetch_total[2h])) > 0.5) and (sum by (source) (increase(pinakes_fetch_total[2h])) >= 20)
        labels: {severity: warning}
        annotations: {summary: "More than half of {{ $labels.source }} fetches are refused (401, 403, 451) or answered by a bot wall"}
      - alert: FeedHeld
        expr: increase(pinakes_feed_held_total[1h]) > 0
        labels: {severity: warning}
        annotations: {summary: "Pinakes quarantined a container snapshot for {{ $labels.source }}"}
      - alert: CancellationBurst
        expr: sum by (source) (increase(pinakes_changes_total{class="cancelled"}[1h])) > 20
        labels: {severity: warning}
        annotations: {summary: "More than twenty cancellations in one hour for {{ $labels.source }}"}
      - alert: IngestPanics
        expr: increase(pinakes_ingest_panics_total[30m]) > 0
        labels: {severity: critical}
        annotations: {summary: "Pinakes ingestion panicked outside a feed line; the Nexus cursor is held"}
      - alert: CursorReset
        expr: (increase(pinakes_source_cursor_resets_total[1h]) > 0) or label_replace(increase(pinakes_ingest_epoch_resets_total[1h]) > 0, "source", "nexus", "", "")
        labels: {severity: info}
        annotations: {summary: "Pinakes resynchronized the {{ $labels.source }} cursor"}
      - alert: RateLimited
        expr: sum by (source) (increase(pinakes_fetch_total{outcome="rate_limited"}[1h])) > 0
        labels: {severity: warning}
        annotations: {summary: "Pinakes received HTTP 429 from {{ $labels.source }}"}
      - alert: DeadLetters
        expr: delta(pinakes_queue_depth{state="dead"}[1h]) >= 50
        labels: {severity: warning}
        annotations: {summary: "Pinakes dead letters grew by fifty in one hour for {{ $labels.resolver }}"}
      - alert: QueueBacklog
        expr: sum(pinakes_refresh_overdue) > 1000
        for: 30m
        labels: {severity: warning, reason: overdue}
        annotations: {summary: "More than a thousand Pinakes refreshes overdue for thirty minutes"}
      - alert: QueueBacklog
        expr: sum by (resolver) (pinakes_queue_depth{state="pending"}) > 1000
        for: 30m
        labels: {severity: warning, reason: pending}
        annotations: {summary: "More than a thousand {{ $labels.resolver }} jobs due and unclaimed for thirty minutes: links are not being read as fast as they arrive"}
      - alert: ApiPanics
        expr: increase(pinakes_api_panics_total[15m]) > 0
        labels: {severity: warning}
        annotations: {summary: "A Pinakes API handler (public or admin listener) panicked; the request was answered 500"}
      - alert: ApiErrors
        expr: (sum(rate(pinakes_api_requests_total{listener="public",status=~"500|504"}[5m])) / sum(rate(pinakes_api_requests_total{listener="public"}[5m])) > 0.05) and (sum(increase(pinakes_api_requests_total{listener="public"}[5m])) >= 20)
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "More than 5% of Pinakes public API requests failed (500) or timed out (504) for five minutes"}
      - alert: ApiRateLimited
        expr: (sum(rate(pinakes_api_requests_total{listener="public",status="429"}[5m])) / sum(rate(pinakes_api_requests_total{listener="public"}[5m])) > 0.2) and (sum(increase(pinakes_api_requests_total{listener="public"}[5m])) >= 20)
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "More than a fifth of Pinakes public API requests answered 429 for ten minutes: the per-address budget is too low for the clients, or they share one address behind a proxy"}
      - alert: PreviewCapacityReached
        expr: increase(pinakes_preview_refused_total[15m]) > 0
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "Pinakes refused new previews ({{ $labels.limit }}) for fifteen minutes: the hourly preview capacity or a client's share is taken"}
      - alert: ProviderKeyRefused
        expr: increase(pinakes_source_token_refusals_total[6h]) > 0
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.source }} refused the configured key: check or rotate the {{ $labels.source }} key (a new key needs a Pinakes restart)"}
      - alert: CatalogueImportFailed
        expr: (increase(pinakes_catalogue_import_errors_total[1h]) > 0) and on (instance, job, catalogue) (pinakes_catalogue_enabled == 1)
        labels: {severity: warning}
        annotations: {summary: "A {{ $labels.catalogue }} catalogue import or update failed in the last hour; pinakesd catalogue status shows the error; the run resumes from its cursor, or, abandoned for its dump, waits for another"}
      - alert: CatalogueNeedsContact
        expr: pinakes_catalogue_needs_contact == 1
        for: 1h
        labels: {severity: warning}
        annotations: {summary: "The {{ $labels.catalogue }} catalogue is on but its importer does not start: set http.contact (or PINAKES__HTTP__CONTACT), or switch the catalogue off"}
      - alert: CatalogueFirstImportStalled
        expr: (pinakes_catalogue_enabled{catalogue=~"musicbrainz|osm|wikidata|openalex|podcastindex|software|tranco"} == 1) and on (instance, job, catalogue) (pinakes_catalogue_last_import_timestamp_seconds == 0)
        for: 2d
        labels: {severity: warning}
        annotations: {summary: "The {{ $labels.catalogue }} catalogue is on and has finished no import in two days: pinakesd catalogue status shows why it waits (free disk, the large-import turn, http.contact)"}
      - alert: CatalogueDumpRefused
        expr: (pinakes_catalogue_refused == 1) and on (instance, job, catalogue) (pinakes_catalogue_enabled == 1)
        for: 1h
        labels: {severity: warning}
        annotations: {summary: "The {{ $labels.catalogue }} catalogue's importer refused the newest dump or file it read and waits for another: pinakesd catalogue status shows which and why; if it is right, ask for a full import of it or clear the refusal (pinakesd catalogue clear-refusal)"}
      - alert: CatalogueTurnBlocked
        expr: (pinakes_catalogue_waiting_for_turn == 1) and on (instance, job) (sum by (instance, job) (increase(pinakes_catalogue_import_errors_total{catalogue=~"wikidata|musicbrainz|osm|openalex"}[1h])) > 0)
        for: 6h
        labels: {severity: warning}
        annotations: {summary: "The {{ $labels.catalogue }} catalogue has waited six hours for the large-import turn while a large catalogue's import keeps failing: pinakesd catalogue status shows which; fix it, switch it off or drop it"}
      - alert: CatalogueJoinsBehind
        expr: pinakes_catalogue_backlog_age_seconds{queue="joins"} > 21600
        for: 30m
        labels: {severity: warning}
        annotations: {summary: "The oldest catalogue join check has been due for over six hours: links wait for their catalogue card or to go back to fetching; pinakes_catalogue_join_errors_total says whether checks fail"}
      - alert: CatalogueHomepageReadsStalled
        expr: (sum by (instance, job) (increase(pinakes_catalogue_homepage_reads_total{result="ok"}[6h])) == 0) and on (instance, job) (sum by (instance, job) (pinakes_catalogue_backlog{queue="homepages"}) > 0) and on (instance, job) (pinakes_catalogue_homepage_reads_waiting == 0) and on (instance, job) (pinakes_catalogue_enabled{catalogue="tranco"} == 1)
        for: 1h
        labels: {severity: warning}
        annotations: {summary: "No Tranco homepage read has found a page for six hours while sites are due and the reads do not wait for a large import: every read is deferred (the egress gives them no turn) or fails; pinakes_catalogue_homepage_reads_total and pinakesd catalogue status say which"}
      - alert: CatalogueJoinErrors
        expr: sum by (instance, job) (increase(pinakes_catalogue_join_errors_total{stage!="extras"}[1h])) > 10
        for: 1h
        labels: {severity: warning}
        annotations: {summary: "Catalogue joins keep failing (more than ten an hour for an hour): the log line names each resource and the error's kind; links are fetched instead or checked again later"}
      - alert: CatalogueItemsSkipped
        expr: sum by (instance, job, catalogue) (increase(pinakes_catalogue_items_skipped_total{reason="over_cap"}[1d])) > 0
        labels: {severity: warning}
        annotations: {summary: "The {{ $labels.catalogue }} importer left a changed item as it was within the last day: its answer alone was over the API cap, so its card misses that change (the log names the item; a full import reads it again)"}
      - alert: CatalogueUpdateLag
        expr: (pinakes_catalogue_update_lag_seconds > on (instance, job, catalogue) pinakes_catalogue_max_update_lag_seconds) and on (instance, job, catalogue) (pinakes_catalogue_enabled == 1) and on (instance, job, catalogue) (pinakes_catalogue_last_import_timestamp_seconds > 0) unless on (instance, job, catalogue) ((pinakes_catalogue_catching_up == 1) and on (instance, job, catalogue) (pinakes_catalogue_update_lag_seconds < on (instance, job, catalogue) (pinakes_catalogue_max_update_lag_seconds + 432000)))
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "The {{ $labels.catalogue }} catalogue's cards are further behind upstream than its source's publication rhythm allows (pinakes_catalogue_max_update_lag_seconds): no import or update has brought newer data"}
      - alert: CatalogueCardsRejected
        expr: (sum by (instance, job, catalogue) (increase(pinakes_catalogue_cards_total{result="rejected"}[1h])) > 100) and (sum by (instance, job, catalogue) (increase(pinakes_catalogue_cards_total{result="rejected"}[1h])) > 0.1 * sum by (instance, job, catalogue) (increase(pinakes_catalogue_cards_total{result=~"inserted|changed|unchanged|rejected"}[1h])))
        labels: {severity: warning}
        annotations: {summary: "The {{ $labels.catalogue }} catalogue's runs refused over a tenth of the cards they read in the last hour (as invalid): a dump format change or an importer bug; the debug log names the refused cards"}
      - alert: CatalogueCardsRemoved
        expr: (sum by (instance, job, catalogue) (increase(pinakes_catalogue_cards_total{result="removed"}[1d])) > 1000) and (sum by (instance, job, catalogue) (increase(pinakes_catalogue_cards_total{result="removed"}[1d])) > 0.1 * (sum by (instance, job, catalogue) (pinakes_catalogue_cards) + sum by (instance, job, catalogue) (increase(pinakes_catalogue_cards_total{result="removed"}[1d]))))
        labels: {severity: warning}
        annotations: {summary: "The {{ $labels.catalogue }} catalogue removed over a tenth of its cards in a day: check that upstream removed them (pinakesd catalogue status; a full import under half its cards fails instead)"}
