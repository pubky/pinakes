# promtool unit tests of the catalogue and background loop alerts with two scraped instances (a and b) of one job:
# each instance's series match only that instance's (scripts/check-ops runs this with promtool).
rule_files:
  - alerts.yml
evaluation_interval: 1m
tests:
  # Wikidata is 3 days behind on both instances (allowed: 2). It is on and imported on a only;
  # b has it off. Each instance exports the allowed lag of every catalogue.
  - interval: 1m
    input_series:
      - series: 'pinakes_catalogue_update_lag_seconds{instance="a",job="pinakes",catalogue="wikidata"}'
        values: '259200+60x60'
      - series: 'pinakes_catalogue_update_lag_seconds{instance="b",job="pinakes",catalogue="wikidata"}'
        values: '259200+60x60'
      - series: 'pinakes_catalogue_max_update_lag_seconds{instance="a",job="pinakes",catalogue="wikidata"}'
        values: '172800x60'
      - series: 'pinakes_catalogue_max_update_lag_seconds{instance="b",job="pinakes",catalogue="wikidata"}'
        values: '172800x60'
      - series: 'pinakes_catalogue_max_update_lag_seconds{instance="a",job="pinakes",catalogue="openalex"}'
        values: '8640000x60'
      - series: 'pinakes_catalogue_max_update_lag_seconds{instance="b",job="pinakes",catalogue="openalex"}'
        values: '8640000x60'
      - series: 'pinakes_catalogue_enabled{instance="a",job="pinakes",catalogue="wikidata"}'
        values: '1x60'
      - series: 'pinakes_catalogue_enabled{instance="b",job="pinakes",catalogue="wikidata"}'
        values: '0x60'
      - series: 'pinakes_catalogue_last_import_timestamp_seconds{instance="a",job="pinakes",catalogue="wikidata"}'
        values: '1795000000x60'
      - series: 'pinakes_catalogue_last_import_timestamp_seconds{instance="b",job="pinakes",catalogue="wikidata"}'
        values: '1795000000x60'
      # Failed runs: wikidata's on both, rising; b has it off.
      - series: 'pinakes_catalogue_import_errors_total{instance="a",job="pinakes",catalogue="wikidata"}'
        values: '0+1x60'
      - series: 'pinakes_catalogue_import_errors_total{instance="b",job="pinakes",catalogue="wikidata"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: CatalogueUpdateLag
        exp_alerts:
          - exp_labels: {severity: warning, instance: a, job: pinakes, catalogue: wikidata}
            exp_annotations:
              summary: "The wikidata catalogue's cards are further behind upstream than its source's publication rhythm allows (pinakes_catalogue_max_update_lag_seconds): no import or update has brought newer data"
      - eval_time: 30m
        alertname: CatalogueImportFailed
        exp_alerts:
          - exp_labels: {severity: warning, instance: a, job: pinakes, catalogue: wikidata}
            exp_annotations:
              summary: "A wikidata catalogue import or update failed in the last hour; pinakesd catalogue status shows the error; the run resumes from its cursor, or, abandoned for its dump, waits for another"
  # MusicBrainz's first import fails on a (a refused dump, say): it has finished no import, and
  # the failure still fires; on b it is off.
  - interval: 1m
    input_series:
      - series: 'pinakes_catalogue_enabled{instance="a",job="pinakes",catalogue="musicbrainz"}'
        values: '1x60'
      - series: 'pinakes_catalogue_enabled{instance="b",job="pinakes",catalogue="musicbrainz"}'
        values: '0x60'
      - series: 'pinakes_catalogue_last_import_timestamp_seconds{instance="a",job="pinakes",catalogue="musicbrainz"}'
        values: '0x60'
      - series: 'pinakes_catalogue_last_import_timestamp_seconds{instance="b",job="pinakes",catalogue="musicbrainz"}'
        values: '0x60'
      - series: 'pinakes_catalogue_import_errors_total{instance="a",job="pinakes",catalogue="musicbrainz"}'
        values: '0 0 0 1x57'
      - series: 'pinakes_catalogue_import_errors_total{instance="b",job="pinakes",catalogue="musicbrainz"}'
        values: '0 0 0 1x57'
    alert_rule_test:
      - eval_time: 30m
        alertname: CatalogueImportFailed
        exp_alerts:
          - exp_labels: {severity: warning, instance: a, job: pinakes, catalogue: musicbrainz}
            exp_annotations:
              summary: "A musicbrainz catalogue import or update failed in the last hour; pinakesd catalogue status shows the error; the run resumes from its cursor, or, abandoned for its dump, waits for another"
  # MusicBrainz's first import was refused on a and b (one failure each, an hour ago and more):
  # the refusal stands, so a, where the catalogue is on, keeps alerting after the failure's hour;
  # b has it off.
  - interval: 1m
    input_series:
      - series: 'pinakes_catalogue_refused{instance="a",job="pinakes",catalogue="musicbrainz"}'
        values: '1x300'
      - series: 'pinakes_catalogue_refused{instance="b",job="pinakes",catalogue="musicbrainz"}'
        values: '1x300'
      - series: 'pinakes_catalogue_enabled{instance="a",job="pinakes",catalogue="musicbrainz"}'
        values: '1x300'
      - series: 'pinakes_catalogue_enabled{instance="b",job="pinakes",catalogue="musicbrainz"}'
        values: '0x300'
      - series: 'pinakes_catalogue_import_errors_total{instance="a",job="pinakes",catalogue="musicbrainz"}'
        values: '1x300'
    alert_rule_test:
      - eval_time: 30m
        alertname: CatalogueDumpRefused
        exp_alerts: []
      - eval_time: 4h
        alertname: CatalogueDumpRefused
        exp_alerts:
          - exp_labels: {severity: warning, instance: a, job: pinakes, catalogue: musicbrainz}
            exp_annotations:
              summary: "The musicbrainz catalogue's importer refused the newest dump it read and waits for another: pinakesd catalogue status shows which and why; if the dump is right, ask for a full import of it"
      - eval_time: 4h
        alertname: CatalogueImportFailed
        exp_alerts: []
  # OpenStreetMap waits for the large-import turn on both instances; only on a does a large
  # catalogue's import keep failing.
  - interval: 1m
    input_series:
      - series: 'pinakes_catalogue_waiting_for_turn{instance="a",job="pinakes",catalogue="osm"}'
        values: '1x500'
      - series: 'pinakes_catalogue_waiting_for_turn{instance="b",job="pinakes",catalogue="osm"}'
        values: '1x500'
      - series: 'pinakes_catalogue_import_errors_total{instance="a",job="pinakes",catalogue="wikidata"}'
        values: '0+1x500'
      - series: 'pinakes_catalogue_import_errors_total{instance="b",job="pinakes",catalogue="wikidata"}'
        values: '0x500'
    alert_rule_test:
      - eval_time: 7h
        alertname: CatalogueTurnBlocked
        exp_alerts:
          - exp_labels: {severity: warning, instance: a, job: pinakes, catalogue: osm}
            exp_annotations:
              summary: "The osm catalogue has waited six hours for the large-import turn while a large catalogue's import keeps failing: pinakesd catalogue status shows which; fix it, switch it off or drop it"
  # Join checks have waited seven hours on a and one on b; extras wait seven hours on both
  # (Wikipedia's pace): only a's joins fire.
  - interval: 1m
    input_series:
      - series: 'pinakes_catalogue_backlog_age_seconds{instance="a",job="pinakes",queue="joins"}'
        values: '25200+60x60'
      - series: 'pinakes_catalogue_backlog_age_seconds{instance="b",job="pinakes",queue="joins"}'
        values: '3600+60x60'
      - series: 'pinakes_catalogue_backlog_age_seconds{instance="a",job="pinakes",queue="extras"}'
        values: '25200+60x60'
      - series: 'pinakes_catalogue_backlog_age_seconds{instance="b",job="pinakes",queue="extras"}'
        values: '25200+60x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: CatalogueJoinsBehind
        exp_alerts:
          - exp_labels: {severity: warning, instance: a, job: pinakes, queue: joins}
            exp_annotations:
              summary: "The oldest catalogue join check has been due for over six hours: links wait for their catalogue card or to go back to fetching; pinakes_catalogue_join_errors_total says whether checks fail"
  # Joins fail twenty times an hour on a, five on b; extras failures don't count.
  - interval: 1m
    input_series:
      - series: 'pinakes_catalogue_join_errors_total{instance="a",job="pinakes",stage="drain"}'
        values: '0+0.34x150'
      - series: 'pinakes_catalogue_join_errors_total{instance="b",job="pinakes",stage="drain"}'
        values: '0+0.08x150'
      - series: 'pinakes_catalogue_join_errors_total{instance="b",job="pinakes",stage="extras"}'
        values: '0+5x150'
    alert_rule_test:
      - eval_time: 140m
        alertname: CatalogueJoinErrors
        exp_alerts:
          - exp_labels: {severity: warning, instance: a, job: pinakes}
            exp_annotations:
              summary: "Catalogue joins keep failing (more than ten an hour for an hour): the log line names each resource and the error's kind; links are fetched instead or checked again later"
  # The text index: on a every pass fails from its open at 0:01 (the last pass stays there); on b
  # passes go on; c never opened (0: SearchIndexClosed, not SearchIndexStalled).
  - interval: 1m
    input_series:
      - series: 'pinakes_search_index_last_pass_timestamp_seconds{instance="a",job="pinakes"}'
        values: '60x60'
      - series: 'pinakes_search_index_last_pass_timestamp_seconds{instance="b",job="pinakes"}'
        values: '0+60x60'
      - series: 'pinakes_search_index_last_pass_timestamp_seconds{instance="c",job="pinakes"}'
        values: '0x60'
      - series: 'pinakes_search_index_open{instance="a",job="pinakes"}'
        values: '1x60'
      - series: 'pinakes_search_index_open{instance="b",job="pinakes"}'
        values: '1x60'
      - series: 'pinakes_search_index_open{instance="c",job="pinakes"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 9m
        alertname: SearchIndexStalled
        exp_alerts: []
      - eval_time: 20m
        alertname: SearchIndexStalled
        exp_alerts:
          - exp_labels: {severity: warning, instance: a, job: pinakes}
            exp_annotations:
              summary: "The Pinakes text index has not read its queue for 10 minutes: text searches miss newer changes"
      - eval_time: 20m
        alertname: SearchIndexClosed
        exp_alerts: []
      - eval_time: 40m
        alertname: SearchIndexClosed
        exp_alerts:
          - exp_labels: {severity: warning, instance: c, job: pinakes}
            exp_annotations:
              summary: "The Pinakes text index has not opened for 30 minutes (unwritable search.index_dir or a failing build): text searches read Postgres alone"
  # Text searches answered 503: about 30 per ten minutes on a, 5 on b.
  - interval: 1m
    input_series:
      - series: 'pinakes_search_index_busy_total{instance="a",job="pinakes",reason="turn"}'
        values: '0+3x40'
      - series: 'pinakes_search_index_busy_total{instance="b",job="pinakes",reason="budget"}'
        values: '0+0.5x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: TextSearchBusy
        exp_alerts:
          - exp_labels: {severity: warning, instance: a, job: pinakes}
            exp_annotations:
              summary: "Pinakes answered over ten text searches 503 in ten minutes for ten minutes: the text index had no free turn (limits.search_index_searches), searches ran past limits.search_index_budget_ms, or one client held its share of turns"
  # Facet, trending and related searches answered 503: about 30 per ten minutes on a, 5 on b.
  - interval: 1m
    input_series:
      - series: 'pinakes_search_heavy_busy_total{instance="a",job="pinakes",reason="turn"}'
        values: '0+3x40'
      - series: 'pinakes_search_heavy_busy_total{instance="b",job="pinakes",reason="share"}'
        values: '0+0.5x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: HeavySearchBusy
        exp_alerts:
          - exp_labels: {severity: warning, instance: a, job: pinakes}
            exp_annotations:
              summary: "Pinakes answered over ten facet, trending or related searches 503 in ten minutes for ten minutes: every turn of limits.search_heavy_searches was taken for limits.search_heavy_wait_ms, or one client held its share"
  # Refused cards: on a, 300 of 1,000 read an hour (fires); on b, 150 of 10,000 (a few, fires not).
  - interval: 1m
    input_series:
      - series: 'pinakes_catalogue_cards_total{instance="a",job="pinakes",catalogue="musicbrainz",result="rejected"}'
        values: '0+5x90'
      - series: 'pinakes_catalogue_cards_total{instance="a",job="pinakes",catalogue="musicbrainz",result="inserted"}'
        values: '0+11.67x90'
      - series: 'pinakes_catalogue_cards_total{instance="b",job="pinakes",catalogue="musicbrainz",result="rejected"}'
        values: '0+2.5x90'
      - series: 'pinakes_catalogue_cards_total{instance="b",job="pinakes",catalogue="musicbrainz",result="unchanged"}'
        values: '0+164x90'
    alert_rule_test:
      - eval_time: 80m
        alertname: CatalogueCardsRejected
        exp_alerts:
          - exp_labels: {severity: warning, instance: a, job: pinakes, catalogue: musicbrainz}
            exp_annotations:
              summary: "The musicbrainz catalogue's runs refused over a tenth of the cards they read in the last hour (as invalid): a dump format change or an importer bug; the debug log names the refused cards"
  # Removed cards: a removes 5,000 of 20,000 in a day (fires); b 2,000 of 1,000,000.
  - interval: 1h
    input_series:
      - series: 'pinakes_catalogue_cards_total{instance="a",job="pinakes",catalogue="tranco",result="removed"}'
        values: '0 5000x30'
      - series: 'pinakes_catalogue_cards{instance="a",job="pinakes",catalogue="tranco"}'
        values: '20000 15000x30'
      - series: 'pinakes_catalogue_cards_total{instance="b",job="pinakes",catalogue="tranco",result="removed"}'
        values: '0 2000x30'
      - series: 'pinakes_catalogue_cards{instance="b",job="pinakes",catalogue="tranco"}'
        values: '1000000 998000x30'
    alert_rule_test:
      - eval_time: 12h
        alertname: CatalogueCardsRemoved
        exp_alerts:
          - exp_labels: {severity: warning, instance: a, job: pinakes, catalogue: tranco}
            exp_annotations:
              summary: "The tranco catalogue removed over a tenth of its cards in a day: check that upstream removed them (pinakesd catalogue status; a full import under half its cards fails instead)"
  # The grouping loop fails on every pass on a; on b it failed once and goes on. The hourly
  # cleanup fails on every pass on a since the start; on b its first pass after the start fails and
  # the next succeeds. The ODbL dump fails every five minutes on a; on b it fails once and is
  # written five minutes later.
  - interval: 1m
    input_series:
      - series: 'pinakes_background_failures_total{instance="a",job="pinakes",loop="grouping"}'
        values: '0+30x240'
      - series: 'pinakes_background_last_success_timestamp_seconds{instance="a",job="pinakes",loop="grouping"}'
        values: '0x240'
      - series: 'pinakes_background_failures_total{instance="b",job="pinakes",loop="grouping"}'
        values: '0 1x239'
      - series: 'pinakes_background_last_success_timestamp_seconds{instance="b",job="pinakes",loop="grouping"}'
        values: '0+60x240'
      - series: 'pinakes_background_failures_total{instance="a",job="pinakes",loop="cleanup"}'
        values: '1x59 2x60 3x60 4x60'
      - series: 'pinakes_background_last_success_timestamp_seconds{instance="a",job="pinakes",loop="cleanup"}'
        values: '0x240'
      - series: 'pinakes_background_failures_total{instance="b",job="pinakes",loop="cleanup"}'
        values: '1x240'
      - series: 'pinakes_background_last_success_timestamp_seconds{instance="b",job="pinakes",loop="cleanup"}'
        values: '0x59 3600x180'
      - series: 'pinakes_background_failures_total{instance="a",job="pinakes",loop="osm_dump"}'
        values: '0 0+1x239'
      - series: 'pinakes_background_last_success_timestamp_seconds{instance="a",job="pinakes",loop="osm_dump"}'
        values: '0x240'
      - series: 'pinakes_background_failures_total{instance="b",job="pinakes",loop="osm_dump"}'
        values: '0 1x239'
      - series: 'pinakes_background_last_success_timestamp_seconds{instance="b",job="pinakes",loop="osm_dump"}'
        values: '0x5 300x235'
    alert_rule_test:
      - eval_time: 30m
        alertname: BackgroundLoopFailing
        exp_alerts:
          - exp_labels: {severity: warning, instance: a, job: pinakes, loop: grouping}
            exp_annotations:
              summary: "The Pinakes grouping loop has failed and finished no pass for 25 minutes: its work waits (groups, also-on rows, hints, catalogue joins and extras, the search revision fold); its warning log line names the error"
      - eval_time: 1h
        alertname: OdblDumpFailing
        exp_alerts:
          - exp_labels: {severity: warning, instance: a, job: pinakes, loop: osm_dump}
            exp_annotations:
              summary: "The ODbL dump has failed for 25 minutes and written no file since: /v1/dumps/osm_place.ndjson.gz serves the previous file, or 503 before the first; its warning log line names the error"
      - eval_time: 1h
        alertname: MaintenanceStepFailing
      - eval_time: 4h
        alertname: MaintenanceStepFailing
        exp_alerts:
          - exp_labels: {severity: warning, instance: a, job: pinakes, loop: cleanup}
            exp_annotations:
              summary: "The hourly cleanup maintenance step keeps failing (three passes in a row, two after a start): its work waits (change retention, orphan cleanup, OSM place or also-on pruning, stale card values); its warning log line names the error"
  # Each loop last succeeded long ago by its cadence, fails once, and its next pass succeeds: no
  # alert fires while the failure is waited out.
  - interval: 1m
    input_series:
      - series: 'pinakes_background_failures_total{instance="a",job="pinakes",loop="grouping"}'
        values: '0x19 1x40'
      - series: 'pinakes_background_last_success_timestamp_seconds{instance="a",job="pinakes",loop="grouping"}'
        values: '1x21 1320x38'
      - series: 'pinakes_background_failures_total{instance="a",job="pinakes",loop="osm_dump"}'
        values: '0x34 1x25'
      - series: 'pinakes_background_last_success_timestamp_seconds{instance="a",job="pinakes",loop="osm_dump"}'
        values: '1x39 2400x20'
      - series: 'pinakes_background_failures_total{instance="a",job="pinakes",loop="cleanup"}'
        values: '0x124 1x115'
      - series: 'pinakes_background_last_success_timestamp_seconds{instance="a",job="pinakes",loop="cleanup"}'
        values: '1x184 11100x55'
    alert_rule_test:
      - eval_time: 21m
        alertname: BackgroundLoopFailing
      - eval_time: 38m
        alertname: OdblDumpFailing
      - eval_time: 2h20m
        alertname: MaintenanceStepFailing
      - eval_time: 3h50m
        alertname: MaintenanceStepFailing
  # The same-event sweep, hourly, last succeeded at the start. On a it fails on every try from
  # 50 minutes on; on b one try fails at 50 minutes and the next succeeds.
  - interval: 1m
    input_series:
      - series: 'pinakes_background_failures_total{instance="a",job="pinakes",loop="same_event_sweep"}'
        values: '0x49 0+12x150'
      - series: 'pinakes_background_last_success_timestamp_seconds{instance="a",job="pinakes",loop="same_event_sweep"}'
        values: '1x200'
      - series: 'pinakes_background_failures_total{instance="b",job="pinakes",loop="same_event_sweep"}'
        values: '0x49 1x150'
      - series: 'pinakes_background_last_success_timestamp_seconds{instance="b",job="pinakes",loop="same_event_sweep"}'
        values: '1x50 3060x150'
    alert_rule_test:
      - eval_time: 1h5m
        alertname: BackgroundLoopFailing
      - eval_time: 1h5m
        alertname: HintSweepFailing
      - eval_time: 1h40m
        alertname: HintSweepFailing
        exp_alerts:
          - exp_labels: {severity: warning, instance: a, job: pinakes, loop: same_event_sweep}
            exp_annotations:
              summary: "The hourly same_event_sweep has failed and finished no pass for an hour and a quarter: hint pairs of units that entered or left the window wait; its warning log line names the error"
  # Map cluster counts answered 503: about 30 per ten minutes on a, 5 on b.
  - interval: 1m
    input_series:
      - series: 'pinakes_api_requests_total{instance="a",job="pinakes",listener="public",route="/v1/map/clusters",status="503"}'
        values: '0+3x40'
      - series: 'pinakes_api_requests_total{instance="b",job="pinakes",listener="public",route="/v1/map/clusters",status="503"}'
        values: '0+0.5x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: MapClustersBusy
        exp_alerts:
          - exp_labels: {severity: warning, instance: a, job: pinakes}
            exp_annotations:
              summary: "Pinakes answered over ten map cluster counts 503 in ten minutes for ten minutes: all four turns were taken, a client held its two, or views too wide for their filter ran past limits.map_cluster_timeout_ms"
  # OpenStreetMap is on without a contact on a, and has finished no import on a for two days; b
  # has it off.
  - interval: 1m
    input_series:
      - series: 'pinakes_catalogue_needs_contact{instance="a",job="pinakes",catalogue="osm"}'
        values: '1x3100'
      - series: 'pinakes_catalogue_needs_contact{instance="b",job="pinakes",catalogue="osm"}'
        values: '0x3100'
      - series: 'pinakes_catalogue_enabled{instance="a",job="pinakes",catalogue="osm"}'
        values: '1x3100'
      - series: 'pinakes_catalogue_enabled{instance="b",job="pinakes",catalogue="osm"}'
        values: '0x3100'
      - series: 'pinakes_catalogue_last_import_timestamp_seconds{instance="a",job="pinakes",catalogue="osm"}'
        values: '0x3100'
      - series: 'pinakes_catalogue_last_import_timestamp_seconds{instance="b",job="pinakes",catalogue="osm"}'
        values: '0x3100'
    alert_rule_test:
      - eval_time: 2h
        alertname: CatalogueNeedsContact
        exp_alerts:
          - exp_labels: {severity: warning, instance: a, job: pinakes, catalogue: osm}
            exp_annotations:
              summary: "The osm catalogue is on but its importer does not start: set http.contact (or PINAKES__HTTP__CONTACT), or switch the catalogue off"
      - eval_time: 50h
        alertname: CatalogueFirstImportStalled
        exp_alerts:
          - exp_labels: {severity: warning, instance: a, job: pinakes, catalogue: osm}
            exp_annotations:
              summary: "The osm catalogue is on and has finished no import in two days: pinakesd catalogue status shows why it waits (free disk, the large-import turn, http.contact)"
      - eval_time: 30h
        alertname: CatalogueFirstImportStalled
        exp_alerts: []
