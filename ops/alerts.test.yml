# promtool unit tests of the catalogue alerts with two scraped instances (a and b) of one job:
# each instance's series match only that instance's (scripts/check-ops runs this with promtool).
rule_files:
  - alerts.yml
evaluation_interval: 1m
tests:
  # Wikidata is 3 days behind on both instances (allowed: 2). It is on and imported on a only;
  # b has it off. Each instance exports the allowed lag of every catalogue.
  - interval: 1m
    input_series:
      - series: 'pinakes_catalogue_update_lag_seconds{instance="a",job="pinakes",catalogue="wikidata"}'
        values: '259200+60x60'
      - series: 'pinakes_catalogue_update_lag_seconds{instance="b",job="pinakes",catalogue="wikidata"}'
        values: '259200+60x60'
      - series: 'pinakes_catalogue_max_update_lag_seconds{instance="a",job="pinakes",catalogue="wikidata"}'
        values: '172800x60'
      - series: 'pinakes_catalogue_max_update_lag_seconds{instance="b",job="pinakes",catalogue="wikidata"}'
        values: '172800x60'
      - series: 'pinakes_catalogue_max_update_lag_seconds{instance="a",job="pinakes",catalogue="openalex"}'
        values: '8640000x60'
      - series: 'pinakes_catalogue_max_update_lag_seconds{instance="b",job="pinakes",catalogue="openalex"}'
        values: '8640000x60'
      - series: 'pinakes_catalogue_enabled{instance="a",job="pinakes",catalogue="wikidata"}'
        values: '1x60'
      - series: 'pinakes_catalogue_enabled{instance="b",job="pinakes",catalogue="wikidata"}'
        values: '0x60'
      - series: 'pinakes_catalogue_last_import_timestamp_seconds{instance="a",job="pinakes",catalogue="wikidata"}'
        values: '1795000000x60'
      - series: 'pinakes_catalogue_last_import_timestamp_seconds{instance="b",job="pinakes",catalogue="wikidata"}'
        values: '1795000000x60'
      # Failed runs: wikidata's on both, rising; b has it off.
      - series: 'pinakes_catalogue_import_errors_total{instance="a",job="pinakes",catalogue="wikidata"}'
        values: '0+1x60'
      - series: 'pinakes_catalogue_import_errors_total{instance="b",job="pinakes",catalogue="wikidata"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: CatalogueUpdateLag
        exp_alerts:
          - exp_labels: {severity: warning, instance: a, job: pinakes, catalogue: wikidata}
            exp_annotations:
              summary: "The wikidata catalogue's cards are further behind upstream than its source's publication rhythm allows (pinakes_catalogue_max_update_lag_seconds): no import or update has brought newer data"
      - eval_time: 30m
        alertname: CatalogueImportFailed
        exp_alerts:
          - exp_labels: {severity: warning, instance: a, job: pinakes, catalogue: wikidata}
            exp_annotations:
              summary: "A wikidata catalogue import or update failed in the last hour; pinakesd catalogue status shows the error, and the run resumes from its cursor"
  # OpenStreetMap waits for the large-import turn on both instances; only on a does a large
  # catalogue's import keep failing.
  - interval: 1m
    input_series:
      - series: 'pinakes_catalogue_waiting_for_turn{instance="a",job="pinakes",catalogue="osm"}'
        values: '1x500'
      - series: 'pinakes_catalogue_waiting_for_turn{instance="b",job="pinakes",catalogue="osm"}'
        values: '1x500'
      - series: 'pinakes_catalogue_import_errors_total{instance="a",job="pinakes",catalogue="wikidata"}'
        values: '0+1x500'
      - series: 'pinakes_catalogue_import_errors_total{instance="b",job="pinakes",catalogue="wikidata"}'
        values: '0x500'
    alert_rule_test:
      - eval_time: 7h
        alertname: CatalogueTurnBlocked
        exp_alerts:
          - exp_labels: {severity: warning, instance: a, job: pinakes, catalogue: osm}
            exp_annotations:
              summary: "The osm catalogue has waited six hours for the large-import turn while a large catalogue's import keeps failing: pinakesd catalogue status shows which; fix it, switch it off or drop it"
