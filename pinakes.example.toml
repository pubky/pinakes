[media]
oembed = "when_needed" # "always" restores eager registry discovery.

[event]
enabled = true
calendars = true
geocoding = true
# A recurring series whose DTSTART is UTC (...Z) expands in UTC, as RFC 5545 says, unless its zone
# comes from a source chosen here: "x_wr_timezone" (default: an explicit X-WR-TIMEZONE, Google's
# exports, or a TZID), "coordinates" (also default_timezone and coordinate-derived zones) or
# "never".
utc_series_wall_clock = "x_wr_timezone"
# default_timezone = "Europe/Zurich" # For floating ICS times only.
# Event cards name other events that are possibly the same one (maybe_same): "on" or "off".
same_event_hint = "on"

# Event platforms (data/event-adapters.json); effective policies: /v1/info.
[event.adapters]
enabled = true
derive_resources = true # Derived links: NIP-52 calendar members, BTC Map event websites.
websocket = true # Nostr relays: one relay hint, after both HTTP indexers miss.

# Each platform takes enabled and key. Missing keys disable only that platform; secrets never
# appear in /v1/info.
# [event.adapters.platforms.ticketmaster]
# key = "" # Supply through protected config or PINAKES__EVENT__ADAPTERS__PLATFORMS__TICKETMASTER__KEY.
# [event.adapters.platforms.resident_advisor]
# enabled = true # Unofficial GraphQL, fragile and off by default.

[http]
# Sent in the User-Agent, pinakes/<version> (+https://pubky.app; <contact>). Empty: the links of
# sources that need a contact wait. An address naming github is refused. Set your own address:
# contact = "operator@example.org"

[egress]
# Exact names or *.example.org. An empty allow list permits all public hosts.
# Lists never override the IP policy. Deny wins.
allow_hosts = []
deny_hosts = []

[groups]
enabled = true
cross_container_occurrences = "off" # Or "corroborated": the cross-feed ICS UID mode.

# "Also on": the same thing on other services, from hubs and exact lookups (docs/api.md).
[also_on]
enabled = true
derive_links = true # Off: keys and facts only; no derived links on cards, nor joins by them.
# [also_on.sources.<id>]
# enabled = false # Turn one source off.
# Podcast Index is asked only with a key and secret: supply them through
# PINAKES__PODCAST_INDEX__KEY and PINAKES__PODCAST_INDEX__SECRET (see .env.example).
# [also_on.sources.discogs]
# token = "" # A Discogs personal access token: images on Discogs cards.

# The tidal source asks TIDAL only with a client ID and secret: supply them through
# PINAKES_TIDAL_CLIENT_ID and PINAKES_TIDAL_CLIENT_SECRET (see .env.example).

[tidal]
country = "US" # The TIDAL catalogue's country (ISO 3166-1 alpha-2, upper case).

[api]
# Applied to every public route (/v1, the agents' guide and /mcp) using the direct peer IP.
requests_per_minute = 120
# Browser origins allowed to call the public listener (CORS). ["*"] allows any origin (the public
# API takes no cookies or tokens); list exact origins such as "https://pubky.app" to restrict;
# [] sends no CORS headers. The admin listener never sends CORS headers.
cors_allow_origins = ["*"]
# Swagger UI for the public OpenAPI document at /swagger-ui; /v1/openapi.json stays either way.
swagger_ui = true
# The MCP endpoint for AI agents at POST /mcp (docs/api.md, Agents); /llms.txt stays either way.
mcp = true

[canary]
enabled = true # Periodic event-platform canaries, reported in metrics.

# [limits]
# resolver_concurrency = 2 # pubky and each card resolver; web_concurrency (4) for web and events
